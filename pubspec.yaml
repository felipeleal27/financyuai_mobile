name: neo_financyuai
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_modular: ^6.3.4
  flutter_mobx: ^2.2.1
  mobx: ^2.3.3+2
  responsive_builder: ^0.7.1
  flutter_smart_dialog: ^4.9.8+1
  flutter_dotenv: ^5.1.0
  dropdown_button2: ^2.3.9

  flutter_localizations:
    sdk: flutter
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  lottie: ^3.3.1
  flutter_slidable: ^3.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  animated_bottom_navigation_bar: ^1.3.3
  intl: ^0.19.0
  dropdown_search: ^6.0.2
  image_picker: ^1.1.2
  firebase_core: ^3.15.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.1.7
  firebase_auth: ^5.3.7
  google_sign_in: ^6.2.2
  connectivity_plus: ^6.1.0
  workmanager: ^0.6.0
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  uuid: ^4.5.1
  flutter_svg: ^2.0.9
  http: ^1.2.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  mobx_codegen: ^2.6.1
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/logo.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/img/
    - assets/lottie/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic

    - family: Shrikhand
      fonts:
        - asset: assets/fonts/Shrikhand/Shrikhand-Regular.ttf
